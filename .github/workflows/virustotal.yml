# Повторная проверка уже опубликованного релиза на VirusTotal: Actions → VirusTotal → Run workflow → тег (v1.2.3).
name: VirusTotal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/virustotal.js "${{ inputs.tag }}"
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
