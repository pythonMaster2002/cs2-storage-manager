# Релиз: поднять version в package.json, затем  git tag vX.Y.Z && git push --tags
#  1) create  — черновик релиза с текстом из build/release-notes.md;
#  2) build   — Windows (установщик + portable), macOS (dmg + zip, Intel и Apple Silicon), Linux (AppImage + deb)
#               собираются параллельно и загружаются в этот черновик;
#  3) publish — черновик публикуется; установленные копии подхватывают обновление (latest.yml / latest-mac.yml).
# Подпись Windows включится сама, если в секретах репозитория есть WIN_CSC_LINK (pfx в base64) и WIN_CSC_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          if curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > /dev/null; then
            echo "release ${TAG} already exists"; exit 0
          fi
          jq -n --arg tag "$TAG" --arg name "Caskit ${VER}" --rawfile body build/release-notes.md \
            '{tag_name: $tag, name: $name, body: $body, draft: true}' > release.json
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" -d @release.json > /dev/null

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64 -c.win.signAndEditExecutable=true
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
          - os: ubuntu-latest
            args: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and upload to the draft release
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # без платной подписи Apple; см. README про первый запуск на macOS
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
            | jq -r --arg tag "${GITHUB_REF_NAME}" '.[] | select(.tag_name == $tag) | .id' | head -1)
          test -n "$ID"
          curl -sf -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${ID}" -d '{"draft": false, "make_latest": "true"}' > /dev/null
